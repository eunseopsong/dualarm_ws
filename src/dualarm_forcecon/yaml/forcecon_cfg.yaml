# ============================================================================
# dualarm_forcecon runtime/control config (v27 split package)
#
# Robot-specific FK/IK/link/joint-name settings live in:
#   dualarm_kinematics/config/*.yaml
#
# This file keeps force/admittance/control parameters only.
# ============================================================================
kinematics:
  # --------------------------------------------------------------------------
  # Robot profile selector
  #
  #   0 = Doosan/AIDIN dualarm
  #   1 = RBY1
  #
  # Runtime override examples:
  #
  #   Select by ID:
  #     -p robot_profile_id:=1
  #
  #   Select by direct YAML path:
  #     -p kinematics_cfg_yaml:=/absolute/path/to/robot_kinematics.yaml
  #
  # Selection priority in C++:
  #   1) ROS parameter kinematics_cfg_yaml
  #   2) ROS parameter robot_profile_id
  #   3) this YAML kinematics.active_robot_id
  #   4) backward-compatible kinematics.config_yaml, if provided
  # --------------------------------------------------------------------------
  active_robot_id: 1

  profiles:
    - id: 0
      name: doosan_dualarm
      config_yaml: /home/eunseop/dualarm_ws/src/dualarm_kinematics/config/doosan_dualarm_kinematics.yaml

    - id: 1
      name: rby1
      config_yaml: /home/eunseop/dualarm_ws/src/dualarm_kinematics/config/rby1_kinematics.yaml

  # Backward-compatible fallback.
  # Normally not used when active_robot_id/profiles are valid.
  config_yaml: /home/eunseop/dualarm_ws/src/dualarm_kinematics/config/doosan_dualarm_kinematics.yaml


# ============================================================================
# Joint command publication policy
# ============================================================================
# mode:
#   full     : publish all joints from /isaac_joint_states and hold unknown joints.
#              Use this for the existing Doosan/AIDIN dualarm workflow.
#   arm_only : publish only arm joints from the selected kinematics profile.
#              Use this for RBY1 arm-only tests so torso/wheel/head joints are not
#              driven by dualarm_forcecon.
#
# For RBY1:
#   active_robot_id: 1
#   command_publish.mode: full_hold_non_arm
#
# For Doosan/AIDIN:
#   active_robot_id: 0
#   command_publish.mode: full
# ============================================================================
command_publish:
  mode: full_hold_non_arm
  publish_rate_hz: 60.0

  # Joint-space slew-rate limiter for arm commands.
  # This prevents IK target step commands from being sent as an instantaneous
  # joint step to the Isaac articulation controller.
  arm_command_filter_enabled: true
  arm_command_max_step_rad: 0.002


# ============================================================================
# RBY1 mobile-base / torso auxiliary control
# ============================================================================
# /cmd_vel is converted to left_wheel/right_wheel velocity commands:
#   left  = (linear.x - angular.z * wheel_base_m / 2) / wheel_radius_m
#   right = (linear.x + angular.z * wheel_base_m / 2) / wheel_radius_m
#
# /forward_aux_joint_targets remains available for:
#   - torso_* position commands
#   - direct left_wheel/right_wheel velocity commands
#
# When wheel velocity is active, dualarm_forcecon still publishes the full
# non-wheel body hold command so torso/head/arms/hands are not dropped.
# ============================================================================
mobile_base:
  wheel_radius_m: 0.1
  wheel_base_m: 0.53
  max_wheel_speed_rad_s: 10.0
  cmd_vel_timeout_sec: 0.3
  aux_joint_velocity_timeout_sec: 0.5
  torso_upright_hold_enabled: true
  torso_upright_hold_during_wheel_only: true
  torso_upright_joint_names:
    - torso_0
    - torso_1
    - torso_2
    - torso_3
    - torso_4
    - torso_5
  torso_upright_positions:
    - 0.0
    - 0.0875
    - 0.0883
    - -0.1739
    - 0.0
    - 0.0

hand_admittance:
  # --------------------------------------------------------------------------
  # defaults: 모든 손가락에 공통 적용
  # per_finger: 특정 손가락만 override (thumb/index/middle/ring/baby)
  # --------------------------------------------------------------------------
  defaults:
    # --- hybrid force axis ---
    use_hybrid_force_position_mode: true
    hybrid_force_axis: 2              # 0=x,1=y,2=z (HAND_BASE)

    # (hybrid 모드에선 사실상 axis 1개만 켜짐, 그래도 문서화용)
    force_ctrl_enable: [false, false, true]

    # --- admittance MDK ---
    mass:      [3.00, 3.00, 3.00]
    damping:   [500.0, 500.0, 500.0]
    stiffness: [1000.0,  1000.0,  1000.0]

    # --- force error sign/definition ---
    force_error_des_minus_meas: true
    force_error_axis_sign: [1.0, 1.0, -1.0]   # ★ z press 방향 필요하면 -1로 뒤집기
    force_deadband_N: [0.0, 0.0, 0.0]

    # --- measured force LPF ---
    use_force_lpf: true
    force_lpf_tau_s: 0.04

    # --- target force ramp ---
    force_target_ramp_rate_Nps: [20.0, 20.0, 20.0]
    force_target_release_rate_Nps: [40.0, 40.0, 40.0]

    # --- contact gate / hysteresis ---
    contact_force_threshold_N: 0.5
    use_contact_hysteresis: true
    contact_on_threshold_N: 0.7
    contact_off_threshold_N: 0.3
    contact_gate_use_enabled_axes_only: true

    # --- tangent anchor ---
    hold_tangent_anchor_on_contact: true
    tangent_anchor_use_measured_pose: true

    # --- slip guard ---
    use_slip_detection: true
    tangent_slip_threshold_m: 0.0015
    use_slip_guard: true
    slip_guard_force_scale: 0.25
    slip_guard_reanchor_tangent: true
    slip_guard_velocity_damping: 0.2

    # --- safety clamps (힘 제어 튐/IK fail 방지 핵심) ---
    max_offset_m: [0.005, 0.005, 0.010]
    max_step_m:   [0.0003, 0.0003, 0.0003]
    max_adm_velocity_mps: [0.01, 0.01, 0.01]

    # --- dt guard ---
    dt_min_s: 0.0001
    dt_max_s: 0.05

    # --- no contact decay ---
    decay_when_no_contact: true
    no_contact_decay_ratio: 0.90

    # --- anti-windup ---
    antiwindup_on_offset_clamp: true
    zero_velocity_on_offset_clamp: true
    offset_clamp_velocity_damping: 0.2
    sync_adm_state_to_final_cmd: true

    # --- IK ---
    ik_max_iters: 80
    ik_tol_pos_m: 0.0005
    ik_lambda: 0.01
    ik_lambda_min: 0.00001
    ik_lambda_max: 1.0
    ik_alpha: 0.8
    ik_alpha_min: 0.05
    ik_max_step: 0.15
    ik_mu_posture: 0.0001

    # --- IK fallback ---
    prefer_last_success_q_seed: true
    keep_last_success_on_ik_fail: true
    damp_velocity_on_ik_fail: true
    ik_fail_velocity_damping: 0.2

    # --- raw sensor transform ---
    R_tip_sensor_rowmajor: [1,0,0, 0,1,0, 0,0,1]
    R_base_corr_rowmajor:  [1,0,0, 0,1,0, 0,0,1]
    fallback_to_f_meas_base_if_sensor_transform_fails: true

    # --- debug ---
    debug_decimation: 50

  per_finger:
    thumb: {}
    index: {}
    middle: {}
    ring: {}
    baby: {}
