# ============================================================================
# RBY1 arm-only kinematics profile template
#
# IMPORTANT:
#   Replace every link/joint name below with the exact names from your RBY1 URDF.
#   This file is a safe template, not yet verified against your local RBY1 model.
# ============================================================================
robot_kinematics:
  profile: rby1_arm_only
  urdf_path: /absolute/path/to/rby1.urdf

  arm:
    base_link: base_link
    left_tip_link: left_ee_link
    right_tip_link: right_ee_link

    left_joint_names:
      - left_arm_joint_1
      - left_arm_joint_2
      - left_arm_joint_3
      - left_arm_joint_4
      - left_arm_joint_5
      - left_arm_joint_6
      - left_arm_joint_7

    right_joint_names:
      - right_arm_joint_1
      - right_arm_joint_2
      - right_arm_joint_3
      - right_arm_joint_4
      - right_arm_joint_5
      - right_arm_joint_6
      - right_arm_joint_7

  hand:
    enabled: false
